name: Clipper CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest numpy python-dotenv
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: pytest -q
      - name: Parse browser JavaScript as an ES module
        run: node --check --input-type=module < web/app.js
