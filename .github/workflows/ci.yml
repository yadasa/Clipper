name: Clipper CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipper-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  quality:
    name: Fast quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lightweight validation tools
        run: python -m pip install --upgrade pip pytest "numpy>=1.26,<2" python-dotenv httpx ruff

      - name: Compile every Python file
        run: python -m compileall -q .

      - name: Ruff fatal-error scan
        run: ruff check . --select E9,F63,F7,F82

      - name: Run unit and regression tests
        run: python -m pytest -q

      - name: Parse browser JavaScript as an ES module
        run: node --check --input-type=module < web/app.js

      - name: Validate Firebase JSON
        run: python -m json.tool firebase.json > /dev/null

  runtime-smoke:
    name: Runtime dependency + FFmpeg feature smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      PYTHONPATH: ${{ github.workspace }}
      FFMPEG_ENCODER: x264
      RENDER_WORKERS: '1'
      VISUAL_PROVIDER: none
      WHISPER_DEVICE: cpu
      AUTO_HARDWARE_PROFILE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Clipper runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Import core runtime modules and FastAPI routes
        run: |
          python - <<'PY'
          import fastapi
          import firebase_admin
          import httpx
          import mediapipe
          import numpy
          from PIL import Image
          from faster_whisper import WhisperModel
          from google import genai
          import clipper.analysis
          import clipper.audio
          import clipper.brand
          import clipper.cache
          import clipper.captions
          import clipper.config
          import clipper.edit_plan
          import clipper.firebase_bridge
          import clipper.focus
          import clipper.hardware
          import clipper.hooks
          import clipper.media
          import clipper.metadata
          import clipper.motion
          import clipper.multicam
          import clipper.pipeline
          import clipper.publish
          import clipper.render
          import clipper.scoring
          import clipper.smartcut
          import clipper.sync
          import clipper.transcript_io
          import clipper.transcription
          import clipper.visuals
          import api
          assert any(route.path == '/api/process' for route in api.app.routes)
          assert any('/rerender' in route.path for route in api.app.routes)
          print('Core imports and API routes OK')
          PY

      - name: Verify required FFmpeg features
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q subtitles
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q loudnorm
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q volume
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q amix
          ffprobe -version

      - name: Render and probe tiny delivery file
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=640x360:rate=30 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 1 -c:v libx264 -preset veryfast -crf 23 \
            -c:a aac -b:a 128k -pix_fmt yuv420p -movflags +faststart /tmp/clipper-smoke.mp4
          test -s /tmp/clipper-smoke.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -of default=noprint_wrappers=1 /tmp/clipper-smoke.mp4 | tee /tmp/probe.txt
          grep -q 'codec_name=h264' /tmp/probe.txt
          grep -q 'width=640' /tmp/probe.txt
          grep -q 'height=360' /tmp/probe.txt
          grep -q 'pix_fmt=yuv420p' /tmp/probe.txt

      - name: Exercise smart cuts, punch-ins, captions, hooks, branding, music, and silent-video fallbacks
        run: python scripts/ffmpeg_feature_smoke.py

  a4000-gpu-smoke:
    name: NVIDIA A4000 CTranslate2 CUDA + NVENC smoke
    # Never execute pull-request code on the user's home PC. The self-hosted
    # workstation is restricted to trusted main-branch pushes or manual runs.
    if: ${{ vars.A4000_RUNNER_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Windows, X64, a4000]
    timeout-minutes: 15
    needs: quality
    env:
      PYTHONPATH: ${{ github.workspace }}
      FFMPEG_ENCODER: nvenc
      WHISPER_DEVICE: cuda
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install GPU smoke dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2" python-dotenv faster-whisper==1.2.1

      - name: Verify A4000 CTranslate2 CUDA and NVENC path
        shell: pwsh
        run: python scripts/gpu_smoke.py
